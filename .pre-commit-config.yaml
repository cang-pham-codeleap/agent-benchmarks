# Pre-commit hooks for agent-benchmarks. There is no hosted CI: these hooks and `just check` are the gates.
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: bunx biome check .
        language: system
        files: '^(src|test|scripts|npm)/.*\.(ts|tsx|cjs|json|html|css)$|^[^/]+\.json$'
        pass_filenames: false

      - id: ts-typecheck
        name: TypeScript typecheck
        entry: bunx tsc --noEmit
        language: system
        files: '^(src|test|scripts)/.*\.ts$|^(package\.json|tsconfig\.json)$'
        pass_filenames: false

      - id: ts-test
        name: TypeScript tests
        entry: bun test
        language: system
        files: '^(src|test|fixtures)/.*|^(package\.json|bun\.lock)$'
        pass_filenames: false
        stages: [pre-push]

      - id: pr-policy
        name: PR policy against origin/main
        entry: bun run scripts/pr-policy.ts --base origin/main
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: sync-model
        name: Sync protocol model (TLC)
        entry: bun run scripts/check-sync-model.ts
        language: system
        files: '^(models/sync-protocol/|src/ui/sync-events\.ts|src/server/sync\.ts)'
        pass_filenames: false
        stages: [pre-push]

      - id: smoke-binary
        name: Compiled binary smoke
        entry: bun run scripts/smoke-binary.ts
        language: system
        files: '^(src|evals|scripts)/|^(package\.json|bun\.lock|bunfig\.toml)$'
        pass_filenames: false
        stages: [pre-push]
