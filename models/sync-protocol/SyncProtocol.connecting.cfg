\* expect: NoStuckSync
\* Open finding, not a mutant: activity between the page's first data load and its EventSource connecting is never announced.
\* A startup sync that ends in that window, followed by a failed status read, leaves the Sync button spinning.
SPECIFICATION Spec
CONSTANTS
  Variant = "current"
  MaxStimuli = 1
  ActivityWhileConnecting = TRUE
INVARIANTS
  CompleteOnlyWhenIdle
  UpdateMeansNewActivity
  NoStuckSync
  NoSilentStaleness
