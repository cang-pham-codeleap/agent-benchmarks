\* expect: NoSilentStaleness
\* Open finding: a sync that starts and ends between the page's first data load and its first status answer is never seen,
\* so the page keeps the data it loaded mid-sync. Fixing it needs a data version in /api/sync/status.
SPECIFICATION Spec
CONSTANTS
  Variant = "current"
  MaxStimuli = 1
  ActivityWhileConnecting = TRUE
INVARIANTS
  CompleteOnlyWhenIdle
  UpdateMeansNewActivity
  NoStuckSync
  NoSilentStaleness
