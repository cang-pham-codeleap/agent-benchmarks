name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          if ! printf '11.5.1\n%s\n' "$(npm --version)" | sort -V -C; then
            npm install -g npm@11
          fi
          npm --version

      - name: Check whether this version is already published
        id: published
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$name@$version" version 2>/tmp/npm-view.err || true)" = "$version" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q E404 /tmp/npm-view.err; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/npm-view.err
            exit 1
          fi
          echo "spec=$name@$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip already-published version
        if: steps.published.outputs.exists == 'true'
        run: echo "::notice::$SPEC is already published; bump the version in package.json to release again."
        env:
          SPEC: ${{ steps.published.outputs.spec }}
