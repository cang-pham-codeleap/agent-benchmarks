name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  typescript:
    name: TypeScript (biome, tsc, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build native binary
        run: bun run scripts/build-binaries.ts --target native --out-dir /tmp/agent-benchmarks-bin --version 0.0.0-ci

      - name: Smoke native binary augments
        run: |
          set -euo pipefail
          bin="$(ls /tmp/agent-benchmarks-bin/*/agent-benchmarks)"
          AGENT_BENCHMARKS_NO_SYNC=1 "$bin" serve --no-sync --db "$RUNNER_TEMP/smoke.db" --port 47900 &
          for _ in $(seq 30); do curl -sf localhost:47900/api/evals/catalog -o "$RUNNER_TEMP/catalog.json" && break; sleep 1; done
          kill %1
          expected="$(ls evals/augments/*.json | wc -l)"
          actual="$(jq '[.augments[] | select(.problem == null or (.problem | endswith("is not on PATH")))] | length' "$RUNNER_TEMP/catalog.json")"
          test "$actual" -eq "$expected"

  docker:
    name: Docker (multi-arch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert Dockerfile builder matches .bun-version
        run: |
          set -euo pipefail
          bun_version="$(cat .bun-version)"
          escaped="${bun_version//./\\.}"
          if ! grep -Eq "^FROM oven/bun:${escaped}-slim(@sha256:[0-9a-f]{64})? AS build$" Dockerfile; then
            echo "::error file=Dockerfile::builder image must be oven/bun:${bun_version}-slim to match .bun-version — bump .bun-version deliberately or revert the Dockerfile tag"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local amd64 image
        run: docker build --platform linux/amd64 -t agent-benchmarks:ci .

      - name: Smoke CLI
        run: docker run --rm agent-benchmarks:ci --help

      - name: Smoke distroless identity and CLI
        run: |
          set -euo pipefail
          test "$(docker image inspect agent-benchmarks:ci --format '{{.Config.User}}')" = '999:999'
          docker run --rm --entrypoint /usr/local/bin/agent-benchmarks agent-benchmarks:ci --version
          container="$(docker create agent-benchmarks:ci)"
          docker cp "$container:/etc/passwd" /tmp/agent-benchmarks-passwd
          docker cp "$container:/etc/group" /tmp/agent-benchmarks-group
          docker export "$container" -o /tmp/agent-benchmarks-rootfs.tar
          python3 - <<'PYTHON'
          import tarfile
          with tarfile.open('/tmp/agent-benchmarks-rootfs.tar') as archive:
              entries = {entry.name.removeprefix('./'): entry for entry in archive}
              for source in ('claude', 'codex', 'gemini', 'cursor', 'copilot', 'vscode', 'atif'):
                  directory = entries[f'sources/{source}']
                  assert directory.isdir() and (directory.uid, directory.gid) == (999, 999), source
              assert 'bin/sh' not in entries and 'usr/bin/apt' not in entries
          PYTHON
          docker rm -v "$container"
          grep -Fx 'agent-benchmarks:x:999:999::/var/lib/agent-benchmarks:/sbin/nologin' /tmp/agent-benchmarks-passwd
          grep -Fx 'agent-benchmarks:x:999:' /tmp/agent-benchmarks-group

      - name: Prepare a volume with the previous runtime's ownership
        run: |
          set -euo pipefail
          docker volume create agent-benchmarks-data
          docker run --rm -v agent-benchmarks-data:/data \
            debian:bookworm-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3 \
            sh -ec 'groupadd --system agent-benchmarks
              useradd --system --gid agent-benchmarks --home-dir /var/lib/agent-benchmarks --create-home agent-benchmarks
              test "$(id -u agent-benchmarks):$(id -g agent-benchmarks)" = "999:999"
              chown agent-benchmarks:agent-benchmarks /data
              chmod 700 /data'

      - name: Smoke /api/* through the bridge (AGENT_BENCHMARKS_TRUST_DEFAULT_GATEWAY)
        run: |
          set -euo pipefail
          docker run -d --name agent-benchmarks-smoke -v agent-benchmarks-data:/var/lib/agent-benchmarks -p 127.0.0.1:3000:3000 agent-benchmarks:ci
          http_status=""
          for _ in $(seq 1 30); do
            http_status="$(curl -sS -o /tmp/agent-benchmarks-health-body.json -w '%{http_code}' http://127.0.0.1:3000/api/health || true)"
            if [ "$http_status" = "200" ]; then
              break
            fi
            if [ "$http_status" = "403" ]; then
              echo "::error::/api/health answered 403 through the published port — the bridge-gateway derivation (AGENT_BENCHMARKS_TRUST_DEFAULT_GATEWAY) did not resolve to a trusted peer on this runner"
              docker network inspect bridge --format '{{range .IPAM.Config}}gateway={{.Gateway}}{{end}}' || true
              cat /tmp/agent-benchmarks-health-body.json || true
              echo
              docker logs agent-benchmarks-smoke || true
              docker rm -f agent-benchmarks-smoke
              exit 1
            fi
            sleep 1
          done
          if [ "$http_status" != "200" ]; then
            echo "::error::/api/health never answered 200 through the published port"
            docker logs agent-benchmarks-smoke || true
            docker rm -f agent-benchmarks-smoke
            exit 1
          fi
          cat /tmp/agent-benchmarks-health-body.json
          echo
          docker cp agent-benchmarks-smoke:/var/lib/agent-benchmarks/agent-benchmarks.db /tmp/agent-benchmarks-smoke.db
          test "$(head -c 15 /tmp/agent-benchmarks-smoke.db)" = 'SQLite format 3'
          docker rm -f agent-benchmarks-smoke
          docker volume rm agent-benchmarks-data

      - name: Validate multi-arch Docker build
        run: docker buildx build --platform linux/amd64,linux/arm64 --output=type=cacheonly .
